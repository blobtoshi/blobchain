# Production single-node deployment for BLOB CHAIN.
# Exposes the node on host port 8080.
#
# Usage:
#   docker compose up -d --build
# Then:
#   curl localhost:8080/health

services:
  node:
    build: .
    container_name: blob-node
    environment:
      PORT: 8080
      NODE_ID: ${NODE_ID:-blob-node}
      DB_PATH: /data/blobchain.db
      PEERS: ${PEERS:-}
      # Bridge configuration
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SOLANA_SPL_MINT_ADDRESS: ${SOLANA_SPL_MINT_ADDRESS}
      SOLANA_MINT_AUTHORITY_SECRET_KEY: ${SOLANA_MINT_AUTHORITY_SECRET_KEY}
      BRIDGE_BLOB_PRIVATE_KEY: ${BRIDGE_BLOB_PRIVATE_KEY}
    ports:
      - "8080:8080"
    volumes:
      - blob-data:/data
    restart: unless-stopped

volumes:
  blob-data:
