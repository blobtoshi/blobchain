# Production single-node deployment for BLOB CHAIN.
# Exposes the node on host port 8080.
#
# Usage:
#   docker compose up -d --build
# Then:
#   curl localhost:8080/health

services:
  node:
    build: .
    container_name: blob-node
    environment:
      PORT: 8080
      NODE_ID: node-blobchain-network
      DB_PATH: /data/blobchain.db
      PEERS: "wss://node.blobchain.network/ws,wss://node-eu.blobchain.network/ws,wss://node-us.blobchain.network/ws"
    ports:
      - "8080:8080"
    volumes:
      - blob-data:/data
    restart: unless-stopped

volumes:
  blob-data:
